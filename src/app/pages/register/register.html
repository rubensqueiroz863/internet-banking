<div class="principal">
<img src="assets/homebackground1.jpg" alt="Background" />

  <div class="register-form">
    <h1>Acesse agora sua conta Internet Banking</h1>
    <form [formGroup]="registerForm" (ngSubmit)="register()">
      <input type="text" formControlName="name" placeholder="Digite seu nome">
      <input type="text" formControlName="cpf" appCpfMask placeholder="Digite seu CPF">
      <input type="email" formControlName="email" placeholder="Digite seu Email">
      <input type="text" formControlName="password" placeholder="Digite sua senha">
      <button type="submit">Cadastrar</button>
    </form>
    <a href="/login">Já possui uma conta?</a>
  </div>
</div>
